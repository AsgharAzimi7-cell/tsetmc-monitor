name: TSETMC Collector

on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Test Iran proxy
        env:
          TSETMC_PROXY: ${{ secrets.TSETMC_PROXY }}
        run: |
          echo "=== Testing proxy IP ==="
          curl -m 20 -x "$TSETMC_PROXY" https://api.ipify.org
          echo ""
          echo "=== Testing TSETMC through proxy ==="
          curl -m 20 -I -x "$TSETMC_PROXY" \
            -A "Mozilla/5.0" \
            https://cdn.tsetmc.com

      - name: Run TSETMC script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TSETMC_PROXY: ${{ secrets.TSETMC_PROXY }}
          HTTP_PROXY: ${{ secrets.TSETMC_PROXY }}
          HTTPS_PROXY: ${{ secrets.TSETMC_PROXY }}
        run: |
          python TSETMC_LIVE_WITH_INDICES_INTRADAY_FIXED.py
