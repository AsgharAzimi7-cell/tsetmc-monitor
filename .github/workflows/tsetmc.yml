name: TSETMC Automatic Collector

on:
  workflow_dispatch:
  schedule:
    # 08:55 Iran time (UTC+3:30), Saturday through Wednesday
    - cron: '25 5 * * 6,0-3'

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 270

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Test first Iran proxy
        env:
          TSETMC_PROXY: ${{ secrets.TSETMC_PROXY }}
        run: |
          echo 'Testing Iran proxy...'
          curl --fail --silent --show-error -m 20 -x "$TSETMC_PROXY" https://api.ipify.org || true
          echo ''
             - name: Restore TSETMC database cache
          uses: actions/cache@v4
          with:
          path: TSETMC_LOCAL_HISTORY.db
          key: tsetmc-db-${{ github.run_id }}
          restore-keys: |
            tsetmc-db-
      - name: Run TSETMC collector
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TSETMC_PROXY: ${{ secrets.TSETMC_PROXY }}
          TSETMC_PROXIES: ${{ secrets.TSETMC_PROXIES }}
          COLLECTOR_MODE: '1'
          SNAPSHOT_SECONDS: '30'
        run: python TSETMC_COLLECTOR_FINAL.py

      - name: Upload reports and local DB
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tsetmc-${{ github.run_id }}
          path: |
            TSETMC_*.xlsx
            TSETMC_LOCAL_HISTORY.db
          if-no-files-found: ignore
          retention-days: 30
